plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

def expoModulesCorePlugin = new File(
    ["node", "--print", "require.resolve('expo-modules-core/package.json')"]
            .execute(null, rootDir)
            .text
            .trim()
).parent + "/android/ExpoModulesCorePlugin.gradle"

apply from: expoModulesCorePlugin

android {
    namespace "com.anonymous.exercisebuddy.mediapipePose"

    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(":expo-modules-core")
    implementation "com.google.mediapipe:tasks-vision:0.10.21"
    compileOnly project(':react-native-vision-camera')

}